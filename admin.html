<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OnAir Studio · Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ff1a1a'/%3E%3Ctext x='50' y='78' font-size='68' text-anchor='middle' fill='%23d4cfc6' font-family='Georgia%2Cserif' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --void: #050505; --iron: #0d0d0d; --steel: #1a1a1a; --gunmetal: #2a2a2a;
  --smoke: #666; --bone: #d4cfc6; --neon: #ff1a1a; --ember: #d4220a;
  --ff-heading: 'Bebas Neue', sans-serif; --ff-mono: 'DM Mono', monospace;
}
html { font-size: 14px; }
body { background: var(--void); color: var(--bone); font-family: var(--ff-mono); line-height: 1.5; }

/* ─── LAYOUT ─── */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 220px; background: var(--iron); border-right: 1px solid var(--gunmetal);
  padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
}
.sidebar-logo { font-family: var(--ff-heading); font-size: 1.8rem; color: var(--neon); letter-spacing: 2px; margin-bottom: 1rem; }
.sidebar-logo span { color: var(--bone); }
.sidebar a {
  display: block; padding: 0.6rem 0.8rem; color: var(--smoke); text-decoration: none;
  border-radius: 4px; font-size: 0.85rem; transition: all 0.2s;
}
.sidebar a:hover, .sidebar a.active { color: var(--bone); background: var(--steel); }
.sidebar a.active { border-left: 2px solid var(--neon); }
.main { margin-left: 220px; flex: 1; padding: 1.5rem 2rem; }

/* ─── LOGIN ─── */
.login-wrap {
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
  position: fixed; inset: 0; background: var(--void); z-index: 100;
}
.login-box { text-align: center; }
.login-box h1 { font-family: var(--ff-heading); font-size: 2.5rem; color: var(--neon); margin-bottom: 1.5rem; letter-spacing: 3px; }
.login-box input {
  background: var(--steel); border: 1px solid var(--gunmetal); color: var(--bone);
  padding: 0.7rem 1rem; font-family: var(--ff-mono); font-size: 0.9rem; width: 260px;
  outline: none; border-radius: 4px;
}
.login-box input:focus { border-color: var(--neon); }
.login-box button {
  display: block; margin: 1rem auto 0; background: var(--neon); color: var(--void);
  border: none; padding: 0.7rem 2rem; font-family: var(--ff-heading); font-size: 1.1rem;
  letter-spacing: 2px; cursor: pointer; border-radius: 4px;
}
.login-error { color: var(--neon); margin-top: 0.8rem; font-size: 0.8rem; min-height: 1.2em; }
.login-wrap.hidden { display: none; }

/* ─── HEADER ─── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--gunmetal);
}
.page-title { font-family: var(--ff-heading); font-size: 1.8rem; letter-spacing: 2px; }

/* ─── DATE NAV ─── */
.date-nav { display: flex; align-items: center; gap: 0.8rem; }
.date-nav button {
  background: var(--steel); border: 1px solid var(--gunmetal); color: var(--bone);
  padding: 0.4rem 0.8rem; cursor: pointer; border-radius: 4px; font-family: var(--ff-mono); font-size: 0.85rem;
}
.date-nav button:hover { border-color: var(--neon); }
.date-nav input[type="date"] {
  background: var(--steel); border: 1px solid var(--gunmetal); color: var(--bone);
  padding: 0.4rem 0.6rem; font-family: var(--ff-mono); font-size: 0.85rem; border-radius: 4px;
}

/* ─── STATS ─── */
.stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.stat-card {
  background: var(--iron); border: 1px solid var(--gunmetal); border-radius: 6px;
  padding: 1rem 1.2rem; min-width: 140px; flex: 1;
}
.stat-value { font-family: var(--ff-heading); font-size: 2rem; color: var(--neon); }
.stat-label { font-size: 0.75rem; color: var(--smoke); text-transform: uppercase; letter-spacing: 1px; }

/* ─── TABLE ─── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th {
  text-align: left; padding: 0.6rem 0.8rem; border-bottom: 2px solid var(--gunmetal);
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--smoke);
}
td { padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--gunmetal); }
tr:hover td { background: var(--iron); }

/* ─── STATUS BADGES ─── */
.badge {
  display: inline-block; padding: 0.15rem 0.5rem; border-radius: 3px;
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-pending { background: #b8943f33; color: #b8943f; }
.badge-confirmed { background: #2ecc7133; color: #2ecc71; }
.badge-cancelled { background: #c0392b33; color: #c0392b; }
.badge-completed { background: #3498db33; color: #3498db; }

/* ─── ACTION BUTTONS ─── */
.actions { display: flex; gap: 0.3rem; }
.btn-sm {
  background: var(--steel); border: 1px solid var(--gunmetal); color: var(--bone);
  padding: 0.25rem 0.5rem; font-size: 0.7rem; cursor: pointer; border-radius: 3px;
  font-family: var(--ff-mono);
}
.btn-sm:hover { border-color: var(--neon); }
.btn-sm.confirm { border-color: #2ecc71; color: #2ecc71; }
.btn-sm.cancel { border-color: #c0392b; color: #c0392b; }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50;
  display: flex; align-items: center; justify-content: center;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--iron); border: 1px solid var(--gunmetal); border-radius: 8px;
  padding: 1.5rem; width: 90%; max-width: 500px;
}
.modal h3 { font-family: var(--ff-heading); font-size: 1.3rem; letter-spacing: 1px; margin-bottom: 1rem; }
.modal label { display: block; font-size: 0.75rem; color: var(--smoke); text-transform: uppercase; margin-bottom: 0.2rem; margin-top: 0.8rem; }
.modal input, .modal select, .modal textarea {
  width: 100%; background: var(--steel); border: 1px solid var(--gunmetal); color: var(--bone);
  padding: 0.5rem; font-family: var(--ff-mono); font-size: 0.85rem; border-radius: 4px;
}
.modal textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.2rem; }
.btn-primary {
  background: var(--neon); color: var(--void); border: none; padding: 0.5rem 1.2rem;
  font-family: var(--ff-heading); font-size: 1rem; letter-spacing: 1px; cursor: pointer; border-radius: 4px;
}
.btn-secondary {
  background: var(--steel); border: 1px solid var(--gunmetal); color: var(--bone);
  padding: 0.5rem 1.2rem; font-family: var(--ff-mono); font-size: 0.85rem; cursor: pointer; border-radius: 4px;
}

/* ─── FILTER TABS ─── */
.filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.filter-tab {
  background: var(--steel); border: 1px solid var(--gunmetal); color: var(--smoke);
  padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border-radius: 3px;
  font-family: var(--ff-mono); text-transform: uppercase;
}
.filter-tab:hover { color: var(--bone); }
.filter-tab.active { border-color: var(--neon); color: var(--neon); }

/* ─── EMPTY STATE ─── */
.empty { text-align: center; padding: 3rem; color: var(--smoke); }
.empty-icon { font-size: 2rem; margin-bottom: 0.5rem; }

/* ─── TOAST ─── */
.toast {
  position: fixed; bottom: 2rem; right: 2rem; background: var(--iron);
  border: 1px solid var(--gunmetal); padding: 0.8rem 1.2rem; border-radius: 6px;
  font-size: 0.85rem; z-index: 60; transform: translateY(100px); opacity: 0;
  transition: all 0.3s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: #2ecc71; }
.toast.error { border-color: #c0392b; }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .sidebar { width: 100%; position: static; flex-direction: row; overflow-x: auto; padding: 0.8rem; }
  .sidebar-logo { margin-bottom: 0; margin-right: 1rem; white-space: nowrap; }
  .main { margin-left: 0; padding: 1rem; }
  .stats { flex-direction: column; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1><span>On</span>AIR ADMIN</h1>
    <form id="loginForm">
      <input type="password" id="loginPw" placeholder="Contraseña" autofocus />
      <button type="submit">ENTRAR</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-logo"><span>On</span>AIR</div>
    <a href="#" class="active" data-view="appointments">Citas</a>
    <a href="#" data-view="blocked">Bloqueos</a>
    <a href="#" data-view="artists">Artistas</a>
    <a href="v2.html" target="_blank">Ver web</a>
  </aside>

  <main class="main" id="mainContent">
    <!-- Content injected by JS -->
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:3001' : '';

let adminPw = '';
let currentView = 'appointments';
let currentDate = new Date().toISOString().slice(0, 10);
let statusFilter = 'all';

// ─── AUTH ───
function headers() {
  return { 'Content-Type': 'application/json', 'X-Admin-Password': adminPw };
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...headers(), ...opts.headers } });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error');
  return data;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  adminPw = document.getElementById('loginPw').value;
  try {
    await api('/api/admin/appointments?date=' + currentDate);
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('app').style.display = 'flex';
    renderView();
  } catch {
    document.getElementById('loginError').textContent = 'Contraseña incorrecta';
  }
});

// ─── NAV ───
document.querySelectorAll('.sidebar a[data-view]').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelectorAll('.sidebar a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    currentView = a.dataset.view;
    renderView();
  });
});

function renderView() {
  if (currentView === 'appointments') renderAppointments();
  else if (currentView === 'blocked') renderBlocked();
  else if (currentView === 'artists') renderArtists();
}

// ─── APPOINTMENTS VIEW ───
async function renderAppointments() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">CITAS</h1>
      <div class="date-nav">
        <button onclick="changeDate(-1)">◄</button>
        <input type="date" value="${currentDate}" onchange="currentDate=this.value;renderAppointments();" />
        <button onclick="changeDate(1)">►</button>
        <button onclick="currentDate=new Date().toISOString().slice(0,10);renderAppointments();">Hoy</button>
      </div>
    </div>
    <div id="statsRow" class="stats"></div>
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="table-wrap" id="tableWrap"></div>
  `;
  await loadAppointments();
}

function changeDate(delta) {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  currentDate = d.toISOString().slice(0, 10);
  renderAppointments();
}

async function loadAppointments() {
  try {
    const rows = await api(`/api/admin/appointments?date=${currentDate}`);
    const pending = rows.filter(r => r.status === 'pending').length;
    const confirmed = rows.filter(r => r.status === 'confirmed').length;
    const cancelled = rows.filter(r => r.status === 'cancelled').length;

    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="stat-value">${rows.length}</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#b8943f">${pending}</div><div class="stat-label">Pendientes</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#2ecc71">${confirmed}</div><div class="stat-label">Confirmadas</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#c0392b">${cancelled}</div><div class="stat-label">Canceladas</div></div>
    `;

    document.getElementById('filterTabs').innerHTML = ['all','pending','confirmed','cancelled','completed']
      .map(s => `<button class="filter-tab ${statusFilter===s?'active':''}" onclick="statusFilter='${s}';loadAppointments();">${s === 'all' ? 'Todas' : s}</button>`)
      .join('');

    const filtered = statusFilter === 'all' ? rows : rows.filter(r => r.status === statusFilter);

    if (filtered.length === 0) {
      document.getElementById('tableWrap').innerHTML = `<div class="empty"><div class="empty-icon">📅</div>Sin citas para este día</div>`;
      return;
    }

    document.getElementById('tableWrap').innerHTML = `
      <table>
        <thead><tr><th>Hora</th><th>Cliente</th><th>Contacto</th><th>Artista</th><th>Servicio</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
          ${filtered.map(r => `
            <tr>
              <td>${(r.appointment_time || '').slice(0,5)}</td>
              <td><strong>${esc(r.client_name)}</strong></td>
              <td>${esc(r.client_email)}<br/><small>${esc(r.client_phone || '')}</small></td>
              <td>${esc(r.artist_name || 'Sin pref.')}</td>
              <td>${esc(r.service_name || r.style || '—')}</td>
              <td><span class="badge badge-${r.status}">${r.status}</span></td>
              <td>
                <div class="actions">
                  ${r.status === 'pending' ? `<button class="btn-sm confirm" onclick="updateStatus(${r.id},'confirmed')">✓</button>` : ''}
                  ${r.status !== 'cancelled' ? `<button class="btn-sm cancel" onclick="updateStatus(${r.id},'cancelled')">✕</button>` : ''}
                  <button class="btn-sm" onclick="showDetail(${r.id})">👁</button>
                  <button class="btn-sm cancel" onclick="deleteAppointment(${r.id})">🗑</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }
}

async function updateStatus(id, status) {
  try {
    await api(`/api/admin/appointments/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    toast(`Cita ${status}`, 'success');
    loadAppointments();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteAppointment(id) {
  if (!confirm('¿Eliminar esta cita?')) return;
  try {
    await api(`/api/admin/appointments/${id}`, { method: 'DELETE' });
    toast('Cita eliminada', 'success');
    loadAppointments();
  } catch (err) { toast(err.message, 'error'); }
}

async function showDetail(id) {
  const rows = await api(`/api/admin/appointments?date=${currentDate}`);
  const r = rows.find(x => x.id === id);
  if (!r) return;
  openModal(`
    <h3>DETALLE CITA #${r.id}</h3>
    <label>Cliente</label><input value="${esc(r.client_name)}" readonly />
    <label>Email</label><input value="${esc(r.client_email)}" readonly />
    <label>Teléfono</label><input value="${esc(r.client_phone || '—')}" readonly />
    <label>Artista</label><input value="${esc(r.artist_name || 'Sin preferencia')}" readonly />
    <label>Estilo</label><input value="${esc(r.style || '—')}" readonly />
    <label>Mensaje</label><textarea readonly>${esc(r.message || '—')}</textarea>
    <label>Notas admin</label>
    <textarea id="adminNotes">${esc(r.admin_notes || '')}</textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cerrar</button>
      <button class="btn-primary" onclick="saveNotes(${r.id})">Guardar notas</button>
    </div>
  `);
}

async function saveNotes(id) {
  const notes = document.getElementById('adminNotes').value;
  try {
    await api(`/api/admin/appointments/${id}`, { method: 'PATCH', body: JSON.stringify({ admin_notes: notes }) });
    toast('Notas guardadas', 'success');
    closeModal();
  } catch (err) { toast(err.message, 'error'); }
}

// ─── BLOCKED SLOTS VIEW ───
async function renderBlocked() {
  const main = document.getElementById('mainContent');
  const weekStart = currentDate;
  const weekEnd = new Date(new Date(currentDate + 'T12:00:00').getTime() + 30 * 86400000).toISOString().slice(0, 10);

  main.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">BLOQUEOS</h1>
      <button class="btn-primary" onclick="showBlockModal()">+ Bloquear horario</button>
    </div>
    <div id="blockedList"></div>
  `;

  try {
    const artists = await api('/api/artists');
    window._artists = artists;
    const blocked = await api(`/api/admin/blocked-slots?from=${weekStart}&to=${weekEnd}`);
    if (blocked.length === 0) {
      document.getElementById('blockedList').innerHTML = `<div class="empty"><div class="empty-icon">🔓</div>Sin bloqueos próximos</div>`;
      return;
    }
    document.getElementById('blockedList').innerHTML = `
      <table>
        <thead><tr><th>Fecha</th><th>Artista</th><th>Horario</th><th>Motivo</th><th></th></tr></thead>
        <tbody>
          ${blocked.map(b => `
            <tr>
              <td>${b.blocked_date.slice(0,10)}</td>
              <td>${esc(b.artist_name)}</td>
              <td>${b.all_day ? 'Todo el día' : (b.start_time||'').slice(0,5) + ' – ' + (b.end_time||'').slice(0,5)}</td>
              <td>${esc(b.reason || '—')}</td>
              <td><button class="btn-sm cancel" onclick="deleteBlock(${b.id})">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    document.getElementById('blockedList').innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }
}

async function showBlockModal() {
  const artists = window._artists || await api('/api/artists');
  openModal(`
    <h3>BLOQUEAR HORARIO</h3>
    <label>Artista</label>
    <select id="blockArtist">
      ${artists.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}
    </select>
    <label>Fecha</label><input type="date" id="blockDate" value="${currentDate}" />
    <label><input type="checkbox" id="blockAllDay" onchange="toggleBlockTime()" /> Todo el día</label>
    <div id="blockTimeFields">
      <label>Desde</label><input type="time" id="blockStart" value="10:00" />
      <label>Hasta</label><input type="time" id="blockEnd" value="14:00" />
    </div>
    <label>Motivo</label><input id="blockReason" placeholder="Opcional" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveBlock()">Bloquear</button>
    </div>
  `);
}

function toggleBlockTime() {
  document.getElementById('blockTimeFields').style.display =
    document.getElementById('blockAllDay').checked ? 'none' : 'block';
}

async function saveBlock() {
  const allDay = document.getElementById('blockAllDay').checked;
  try {
    await api('/api/admin/blocked-slots', {
      method: 'POST',
      body: JSON.stringify({
        artist_id: parseInt(document.getElementById('blockArtist').value),
        blocked_date: document.getElementById('blockDate').value,
        start_time: allDay ? null : document.getElementById('blockStart').value,
        end_time: allDay ? null : document.getElementById('blockEnd').value,
        reason: document.getElementById('blockReason').value || null,
        all_day: allDay,
      }),
    });
    toast('Horario bloqueado', 'success');
    closeModal();
    renderBlocked();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteBlock(id) {
  if (!confirm('¿Eliminar bloqueo?')) return;
  try {
    await api(`/api/admin/blocked-slots/${id}`, { method: 'DELETE' });
    toast('Bloqueo eliminado', 'success');
    renderBlocked();
  } catch (err) { toast(err.message, 'error'); }
}

// ─── ARTISTS VIEW ───
async function renderArtists() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">ARTISTAS</h1>
      <button class="btn-primary" onclick="showArtistModal()">+ Añadir</button>
    </div>
    <div id="artistsList"></div>
  `;
  try {
    const artists = await api('/api/artists');
    document.getElementById('artistsList').innerHTML = `
      <table>
        <thead><tr><th>Nombre</th><th>Handle</th><th>Especialidades</th><th></th></tr></thead>
        <tbody>
          ${artists.map(a => `
            <tr>
              <td><strong>${esc(a.name)}</strong></td>
              <td>${esc(a.handle || '')}</td>
              <td>${(a.specialties || []).map(s => `<span class="badge badge-confirmed">${esc(s)}</span>`).join(' ')}</td>
              <td><button class="btn-sm" onclick="editArtist(${a.id},'${esc(a.name)}','${esc(a.handle||'')}','${(a.specialties||[]).join(',')}')">✎</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    document.getElementById('artistsList').innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }
}

function showArtistModal(id, name, handle, specs) {
  const isEdit = !!id;
  openModal(`
    <h3>${isEdit ? 'EDITAR' : 'NUEVO'} ARTISTA</h3>
    <label>Nombre</label><input id="artistName" value="${name || ''}" />
    <label>Handle</label><input id="artistHandle" value="${handle || ''}" placeholder="@handle" />
    <label>Especialidades (separadas por coma)</label><input id="artistSpecs" value="${specs || ''}" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveArtist(${id || 'null'})">${isEdit ? 'Guardar' : 'Crear'}</button>
    </div>
  `);
}

function editArtist(id, name, handle, specs) {
  showArtistModal(id, name, handle, specs);
}

async function saveArtist(id) {
  const body = {
    name: document.getElementById('artistName').value,
    handle: document.getElementById('artistHandle').value || null,
    specialties: document.getElementById('artistSpecs').value.split(',').map(s => s.trim()).filter(Boolean),
  };
  try {
    if (id) {
      await api(`/api/admin/artists/${id}`, { method: 'PATCH', body: JSON.stringify(body) });
    } else {
      await api('/api/admin/artists', { method: 'POST', body: JSON.stringify(body) });
    }
    toast(id ? 'Artista actualizado' : 'Artista creado', 'success');
    closeModal();
    renderArtists();
  } catch (err) { toast(err.message, 'error'); }
}

// ─── MODAL / TOAST HELPERS ───
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
